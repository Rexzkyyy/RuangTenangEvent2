<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="description" content="Ruang Tenang Event - Menemukan Diri, Menata Hati, Meraih Arti" />
    <!-- Open Graph / WhatsApp Share Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ruang Tenang Event" />
    <meta property="og:description" content="Silakan akses link ini untuk melihat tiket atau mengklaim e-sertifikat kehadiran Anda di acara Ruang Tenang." />
    <!-- Catatan: Untuk WhatsApp, idealnya og:image menggunakan URL lengkap (https://domain.com/pwa-512x512.png) -->
    <meta property="og:image" content="/pwa-512x512.png" />
    
    <title>Ruang Tenang Event</title>
    <!-- Preconnect for Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Unregister old service workers BEFORE any module loads -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          if (registrations.length > 0) {
            Promise.all(registrations.map(function(r) { return r.unregister(); }))
              .then(function() {
                if (!sessionStorage.getItem('sw_cleared')) {
                  sessionStorage.setItem('sw_cleared', '1');
                  window.location.reload();
                }
              });
          } else {
            sessionStorage.removeItem('sw_cleared');
          }
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
